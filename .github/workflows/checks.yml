name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published release tag to verify without modifying it
        type: string
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Verify published release assets
        if: env.RELEASE_TAG != ''
        run: node scripts/release-check.cjs --release "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save verification evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-checks-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
